# ─────────────────────────────────────────────────────────────
#  Publications — the ONLY place you need to edit.
#
#  Add a new paper by copying a block and changing the fields.
#  On push, a GitHub Action rebuilds publications.html, the
#  homepage highlights and assets/publications.bib automatically.
#  (Locally: python3 tools/build_publications.py)
#
#  Fields
#    id        short unique key, also used as the BibTeX key
#    authors   list, exactly as printed; your name is bolded automatically
#    year      issue year (online-first year can go in `note`)
#    title     *asterisks* → italics (use for Latin names)
#    journal, volume, issue, pages   — leave blank if unknown
#    doi       without https://doi.org/
#    topics    any of: hybridisation, scots-pine, organellar, adaptation,
#              conservation, phylogeography, methods, other
#    oa        true if open access
#    data      URL of the dataset (Dryad, Zenodo, …)
#    code      URL of the code (GitHub, …)
#    featured  true → also shown on the homepage (keep to about 3)
#    tldr      one plain-language sentence, in your own voice
# ─────────────────────────────────────────────────────────────

